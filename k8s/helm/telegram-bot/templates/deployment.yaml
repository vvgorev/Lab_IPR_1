apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-telegram-bot
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      containers:
      - name: bot
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8080
        env:
        - name: BOT_TOKEN
          value: {{ .Values.bot.token | quote }}
        - name: DATABASE_URL
          value: {{ .Values.database.url | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}